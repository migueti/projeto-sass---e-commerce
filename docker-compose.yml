version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nuvem-postgres
    environment:
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: nuvem123
      POSTGRES_DB: nuvem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvem"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
